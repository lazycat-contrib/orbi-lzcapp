version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/orbi.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: orbi

build:
  run_buildscript: false

images:
  - id: orbi
    target: service
    service: orbi
    source: ghcr.io/orbi-build/orbi
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Orbi
    summary: "熄灯软件工厂：Issue 自动交付评审合并的 PR"
